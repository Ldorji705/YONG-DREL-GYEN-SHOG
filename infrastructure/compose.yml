
services:

  # 1. MySQL Database
  mysql:
    image: mysql:8.4
    container_name: yongdrel-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: yongdrel_template
      MYSQL_USER: yongdrel
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 2. Redis
  redis:
    image: redis:7-alpine
    container_name: yongdrel-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    command: ["redis-server", "--appendonly", "yes"]

    volumes:
      - redis_data:/data

  # 3. RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    container_name: yongdrel-rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # 4. Authentication Microservice
  auth-service:
    build:
      context: ../services/auth-service
      dockerfile: Dockerfile

    image: yongdrel-auth:local
    restart: unless-stopped

    ports:
      - "8085:8085"

    environment:
      SPRING_PROFILES_ACTIVE: docker

      DB_USERNAME: yongdrel
      DB_PASSWORD: ${MYSQL_PASSWORD}

      JWT_PRIVATE_KEY_PATH: /app/keys/private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem

      CONFIG_SERVER_URL: http://config-server:8888

    volumes:
      - ./keys/private.pem:/app/keys/private.pem:ro
      - ./keys/public.pem:/app/keys/public.pem:ro

    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_started

  # 5. API Gateway
  api-gateway:
    build:
      context: ../api-gateway
      dockerfile: Dockerfile

    image: yongdrel-gateway:local
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: docker

      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem

      CONFIG_SERVER_URL: http://config-server:8888

    volumes:
      - ./keys/public.pem:/app/keys/public.pem:ro

    depends_on:
      auth-service:
        condition: service_started
      config-server:
        condition: service_started
      winner-service:
        condition: service_started
      ticket-issuance-service:
        condition: service_started
      prize-claim-service:
        condition: service_started
  # 6. Config Server
  config-server:
    build:
      context: ../config-server
      dockerfile: Dockerfile

    image: yongdrel-config:local
    restart: unless-stopped

    ports:
      - "8888:8888"

    environment:
      CONFIG_REPO_LOCATION: file:/app/config-repo

    volumes:
      - ../config-server/config-repo:/app/config-repo:ro

  # 7. Service Template
  service-template:
    build:
      context: ../services/service-template
      dockerfile: Dockerfile

    image: yongdrel-template:local
    restart: unless-stopped

    ports:
      - "8081:8081"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/yongdrel_template
      SPRING_DATASOURCE_USERNAME: yongdrel
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started

  # 8. Winner Microservice
  winner-service:
    build:
      context: ../services/winner-service
      dockerfile: Dockerfile

    image: yongdrel-winner:local
    restart: unless-stopped

    ports:
      - "8094:8094"

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: yongdrel
      DB_PASSWORD: ${MYSQL_PASSWORD}

      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem

      APP_SERVICES_EVENT_URL: "http://event-service:8084"
      APP_SERVICES_PRIZE_URL: "http://prize-catalog-service:8086"

    volumes:
      - ./keys/public.pem:/app/keys/public.pem:ro

    depends_on:
      mysql:
        condition: service_healthy

  # Event Microservice
  event-service:
    build:
      context: ../services/event-service
      dockerfile: Dockerfile
    image: yongdrel-event:local
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/yongdrel_events
      DB_USERNAME: yongdrel
      DB_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
    volumes:
      - ./keys/public.pem:/app/keys/public.pem:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started



  # 9. Ticket Issuance Microservice
  ticket-issuance-service:
    build:
      context: ../services/ticket-issuance-service
      dockerfile: Dockerfile

    image: yongdrel-ticket-issuance:local
    restart: unless-stopped

    ports:
      - "8087:8087"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/yongdrel_tickets
      DB_USERNAME: yongdrel
      DB_PASSWORD: ${MYSQL_PASSWORD}

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem

      APP_OUTBOX_DISPATCHER_ENABLED: "false"
      APP_PAYMENT_LISTENER_ENABLED: "false"

    volumes:
      - ./keys/public.pem:/app/keys/public.pem:ro

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
  # 10. Prize Catalog Microservice
  prize-catalog-service:
    build:
      context: ../services/prize-catalog-service
      dockerfile: Dockerfile
    image: yongdrel-prize-catalog:local
    restart: unless-stopped
    ports:
      - "8088:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/yongdrel_prizes
      DB_USERNAME: yongdrel
      DB_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
    volumes:
      - ./keys/public.pem:/app/keys/public.pem:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
  # 11. Prize Claim Microservice
  prize-claim-service:
    build:
      context: ../services/prize-claim-service
      dockerfile: Dockerfile
    image: yongdrel-prize-claim:local
    restart: unless-stopped
    ports:
      - "8095:8095"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: yongdrel
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
      WINNER_SERVICE_URL: http://winner-service:8094
      PRIZE_SERVICE_URL: http://prize-catalog-service:8086
    volumes:
      - ./keys/public.pem:/app/keys/public.pem:ro
    depends_on:
      mysql:
        condition: service_healthy
      winner-service:
        condition: service_started
      prize-catalog-service:
        condition: service_started

  # 10. Transaction Ledger Microservice (SCRUM-253)
  transaction-ledger-service:
    build:
      context: ../services/transaction-ledger-service
      dockerfile: Dockerfile

    image: yongdrel-transaction-ledger:local
    restart: unless-stopped

    ports:
      - "8098:8098"

    environment:
      # Database must exist first: see services/transaction-ledger-service/README.md
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/yongdrel_ledger
      DB_USERNAME: yongdrel
      DB_PASSWORD: ${MYSQL_PASSWORD}

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem

      # Shared secret for internal callers of POST /api/ledger/entries
      LEDGER_INTERNAL_API_KEY: ${LEDGER_INTERNAL_API_KEY}

    volumes:
      - ./keys/public.pem:/app/keys/public.pem:ro

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started

  # 11. Refund Microservice (SCRUM-254)
  refund-service:
    build:
      context: ../services/refund-service
      dockerfile: Dockerfile

    image: yongdrel-refund:local
    restart: unless-stopped

    ports:
      - "8099:8099"

    environment:
      # Database must exist first: see services/refund-service/README.md
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/yongdrel_refunds
      DB_USERNAME: yongdrel
      DB_PASSWORD: ${MYSQL_PASSWORD}

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem

      # Payment Service is not in this compose file yet; this is its expected name/port
      PAYMENT_SERVICE_URL: http://payment-service:8086
      LEDGER_SERVICE_URL: http://transaction-ledger-service:8098
      LEDGER_INTERNAL_API_KEY: ${LEDGER_INTERNAL_API_KEY}
      REFUND_PROVIDER_MODE: SUCCESS

    volumes:
      - ./keys/public.pem:/app/keys/public.pem:ro

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      transaction-ledger-service:
        condition: service_started

  # 12. Wallet Microservice (SCRUM-252)
  wallet-service:
    build:
      context: ../services/wallet-service
      dockerfile: Dockerfile

    image: yongdrel-wallet:local
    restart: unless-stopped

    ports:
      - "8097:8097"

    environment:
      # Database must exist first: see services/wallet-service/README.md
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/yongdrel_wallets
      DB_USERNAME: yongdrel
      DB_PASSWORD: ${MYSQL_PASSWORD}

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem

      # Shared secret for internal callers of POST /api/wallets/credit
      WALLET_INTERNAL_API_KEY: ${WALLET_INTERNAL_API_KEY}
      LEDGER_SERVICE_URL: http://transaction-ledger-service:8098
      LEDGER_INTERNAL_API_KEY: ${LEDGER_INTERNAL_API_KEY}

    volumes:
      - ./keys/public.pem:/app/keys/public.pem:ro

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      transaction-ledger-service:
        condition: service_started

# Persistent Data Volumes
volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
