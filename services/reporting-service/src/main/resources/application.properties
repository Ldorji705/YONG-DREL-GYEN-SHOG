
spring.application.name=reporting-service

server.port=8092

spring.profiles.default=dev

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate never alters it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT issued by auth-service (RS256)
app.jwt.public-key=file:${JWT_PUBLIC_KEY_PATH}
app.jwt.issuer=yongdrel-auth
app.jwt.audience=yongdrel-api

# RabbitMQ feed from the owning services; invalid messages go to the dead-letter queue.
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
