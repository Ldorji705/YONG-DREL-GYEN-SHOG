
spring.application.name=transaction-ledger-service
server.port=8098

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3307/yongdrel_ledger
spring.datasource.username=${DB_USERNAME:yongdrel}
spring.datasource.password=${DB_PASSWORD}

# Schema is created by Flyway migrations; Hibernate only checks it matches
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:yongdrel}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Actuator
management.endpoints.web.exposure.include=health,info

# JWT validation (same settings as the other services)
spring.security.oauth2.resourceserver.jwt.public-key-location=file:${JWT_PUBLIC_KEY_PATH}
app.jwt.issuer=yongdrel-auth
app.jwt.audience=yongdrel-api

# Shared secret for internal callers of POST /api/ledger/entries.
# Never commit the real value; it comes from the environment.
app.ledger.internal-api-key=${LEDGER_INTERNAL_API_KEY:}
