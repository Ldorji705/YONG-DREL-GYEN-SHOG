
spring.application.name=prize-claim-service
server.port=8095

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/yongdrel_prize_claims
spring.datasource.username=${DB_USERNAME:yongdrel}
spring.datasource.password=${DB_PASSWORD:${MYSQL_PASSWORD}}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.security.oauth2.resourceserver.jwt.public-key-location=file:${JWT_PUBLIC_KEY_PATH}
app.jwt.issuer=yongdrel-auth
app.jwt.audience=yongdrel-api

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration

app.services.winner.base-url=${WINNER_SERVICE_URL:http://localhost:8094}
app.services.prize.base-url=${PRIZE_SERVICE_URL:http://localhost:8086}
