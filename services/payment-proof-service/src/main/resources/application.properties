spring.application.name=payment-proof-service
server.port=8090
spring.datasource.url=jdbc:mysql://localhost:3307/yongdrel_payment_proofs
spring.datasource.username=${DB_USERNAME:yongdrel}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.security.oauth2.resourceserver.jwt.public-key-location=file:${JWT_PUBLIC_KEY_PATH}
app.upload.max-bytes=${PAYMENT_PROOF_MAX_BYTES:5242880}
app.storage.root=${PAYMENT_PROOF_STORAGE_ROOT:/var/lib/yongdrel/payment-proofs}
app.services.order-url=${ORDER_SERVICE_URL:http://localhost:8089}
app.internal.order-api-key=${ORDER_INTERNAL_API_KEY}
app.internal.api-key=${PAYMENT_PROOF_INTERNAL_API_KEY}
management.endpoints.web.exposure.include=health,info
