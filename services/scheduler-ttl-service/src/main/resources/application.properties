spring.application.name=scheduler-ttl-service
spring.datasource.url=jdbc:mysql://localhost:3307/yongdrel_scheduler
spring.datasource.username=${DB_USERNAME:yongdrel}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
app.scheduler.poll-ms=${SCHEDULER_POLL_MS:30000}
app.scheduler.lease-seconds=${SCHEDULER_LEASE_SECONDS:60}
app.services.order-url=${ORDER_SERVICE_URL:http://localhost:8089}
app.services.inventory-url=${TICKET_INVENTORY_SERVICE_URL:http://localhost:8088}
app.services.event-url=${EVENT_SERVICE_URL:http://localhost:8084}
app.internal.order-api-key=${ORDER_SCHEDULER_API_KEY}
app.internal.inventory-api-key=${TICKET_INTERNAL_API_KEY}
app.internal.event-api-key=${EVENT_INTERNAL_API_KEY}
