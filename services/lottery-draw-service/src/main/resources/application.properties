spring.application.name=lottery-draw-service
server.port=8088

# MySQL connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/yongdrel_draw}
spring.datasource.username=${DB_USERNAME:yongdrel}
spring.datasource.password=${DB_PASSWORD}

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT configuration
app.jwt.issuer=yongdrel-auth
app.jwt.audience=yongdrel-api

# Actuator
management.endpoints.web.exposure.include=health,info

# Verify JWT signatures using the Auth Service public key
spring.security.oauth2.resourceserver.jwt.public-key-location=file:${JWT_PUBLIC_KEY_PATH}

management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:yongdrel}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Event Service integration
app.services.event-url=${EVENT_SERVICE_URL:http://localhost:8084}

app.services.ticket-url=${TICKET_SERVICE_URL:http://localhost:8087}
app.internal.ticket-api-key=${TICKET_INTERNAL_API_KEY}
