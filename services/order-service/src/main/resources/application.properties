spring.application.name=order-service
server.port=8089
spring.datasource.url=jdbc:mysql://localhost:3307/yongdrel_orders
spring.datasource.username=${DB_USERNAME:yongdrel}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.security.oauth2.resourceserver.jwt.public-key-location=file:${JWT_PUBLIC_KEY_PATH}
app.services.inventory-url=${TICKET_INVENTORY_SERVICE_URL:http://localhost:8088}
app.services.payment-url=${PAYMENT_SERVICE_URL:http://localhost:8086}
app.internal.inventory-api-key=${TICKET_INTERNAL_API_KEY}
app.internal.payment-api-key=${PAYMENT_INTERNAL_API_KEY}
app.services.payment-proof-url=${PAYMENT_PROOF_SERVICE_URL:http://localhost:8090}
app.internal.payment-api-key=${PAYMENT_INTERNAL_API_KEY}
app.internal.scheduler-api-key=${ORDER_SCHEDULER_API_KEY}
management.endpoints.web.exposure.include=health,info
