
spring.application.name=ticket-issuance-service
server.port=8087

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3307/yongdrel_tickets
spring.datasource.username=${DB_USERNAME:yongdrel}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:yongdrel}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Actuator
management.endpoints.web.exposure.include=health,info

spring.security.oauth2.resourceserver.jwt.public-key-location=file:${JWT_PUBLIC_KEY_PATH}

app.jwt.issuer=yongdrel-auth

app.jwt.audience=yongdrel-api


# RabbitMQ publisher reliability
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Disabled until payment integration and validation are verified
app.payment.listener.enabled=false
app.outbox.dispatcher.enabled=false