
spring.application.name=fraud-risk-service

server.port=8090

spring.profiles.default=dev

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate never alters it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT issued by auth-service (RS256)
app.jwt.public-key=file:${JWT_PUBLIC_KEY_PATH}
app.jwt.issuer=yongdrel-auth
app.jwt.audience=yongdrel-api

# Risk scoring (0-100). A flag for manual review is raised when score >= flag-threshold.
app.fraud.flag-threshold=30
app.fraud.medium-score=30
app.fraud.high-score=70

# Cross-service reference check: verify the order exists in order-service and matches tenant/event/buyer.
# Switch on once order-service is deployed.
app.references.order-service.enabled=${ORDER_SERVICE_CHECK_ENABLED:false}
app.references.order-service.base-url=${ORDER_SERVICE_URL:http://localhost:8082}
app.references.order-service.connect-timeout=2s
app.references.order-service.read-timeout=3s

# RabbitMQ (flag events)
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
