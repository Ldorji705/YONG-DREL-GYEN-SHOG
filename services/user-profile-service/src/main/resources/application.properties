spring.application.name=user-profile-service
server.port=8082

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3307/yongdrel_users
spring.datasource.username=${DB_USERNAME:yongdrel}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:yongdrel}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Actuator
management.endpoints.web.exposure.include=health,info
# Health check details
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

# JWT Authentication
spring.security.oauth2.resourceserver.jwt.public-key-location=file:${JWT_PUBLIC_KEY_PATH}

# Expected JWT claims
app.jwt.issuer=yongdrel-auth
app.jwt.audience=yongdrel-api