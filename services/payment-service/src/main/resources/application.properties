spring.application.name=payment-service
server.port=8086

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3307/yongdrel_payments
spring.datasource.username=${DB_USERNAME:yongdrel}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:yongdrel}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# RabbitMQ publisher reliability
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Actuator
management.endpoints.web.exposure.include=health,info

# Payment event publishing will be implemented later
app.payment.publisher.enabled=false

# JWT Security
spring.security.oauth2.resourceserver.jwt.public-key-location=file:${JWT_PUBLIC_KEY_PATH}

app.jwt.issuer=yongdrel-auth
app.jwt.audience=yongdrel-api

# Payment outbox dispatcher
app.outbox.dispatcher.enabled=false
app.outbox.dispatcher.delay-ms=5000
