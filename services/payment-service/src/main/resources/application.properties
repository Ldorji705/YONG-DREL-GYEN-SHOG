spring.application.name=payment-service
server.port=8086

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3307/yongdrel_payments
spring.datasource.username=${DB_USERNAME:yongdrel}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:yongdrel}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# RabbitMQ publisher reliability
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Actuator
management.endpoints.web.exposure.include=health,info

# Payment event publishing will be implemented later
app.payment.publisher.enabled=false

# JWT Security
spring.security.oauth2.resourceserver.jwt.public-key-location=file:${JWT_PUBLIC_KEY_PATH}

app.jwt.issuer=yongdrel-auth
app.jwt.audience=yongdrel-api

# No organizer role is issued by Auth Service yet. Keep approval fail-closed.
app.organizer.roles=

# Payment outbox dispatcher
app.outbox.dispatcher.enabled=false
app.outbox.dispatcher.delay-ms=5000

# Trusted verification dependencies; approval fails closed if unavailable.
app.services.payment-proof-url=${PAYMENT_PROOF_SERVICE_URL:http://localhost:8090}
app.services.event-url=${EVENT_SERVICE_URL:http://localhost:8084}
app.internal.payment-proof-api-key=${PAYMENT_PROOF_INTERNAL_API_KEY}
app.internal.event-api-key=${EVENT_INTERNAL_API_KEY}
app.services.order-url=${ORDER_SERVICE_URL:http://localhost:8089}
app.internal.order-api-key=${ORDER_INTERNAL_API_KEY}
app.internal.payment-proof-api-key=${PAYMENT_INTERNAL_API_KEY}
