spring.application.name=bulk-verification-service
server.port=8091
spring.datasource.url=jdbc:mysql://localhost:3307/yongdrel_bulk_verification
spring.datasource.username=${DB_USERNAME:yongdrel}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.security.oauth2.resourceserver.jwt.public-key-location=file:${JWT_PUBLIC_KEY_PATH}
app.services.payment-url=${PAYMENT_SERVICE_URL:http://localhost:8086}
app.internal.payment-api-key=${PAYMENT_INTERNAL_API_KEY}
management.endpoints.web.exposure.include=health,info
