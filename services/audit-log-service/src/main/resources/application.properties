
spring.application.name=audit-log-service

server.port=8091

spring.profiles.default=dev

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate never alters it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT issued by auth-service (RS256)
app.jwt.public-key=file:${JWT_PUBLIC_KEY_PATH}
app.jwt.issuer=yongdrel-auth
app.jwt.audience=yongdrel-api

# Cross-service reference check: tenantId must exist in the Tenant Service. Switch on once it is deployed.
app.references.tenant-service.enabled=${TENANT_SERVICE_CHECK_ENABLED:false}
app.references.tenant-service.base-url=${TENANT_SERVICE_URL:http://localhost:8083}
app.references.tenant-service.connect-timeout=2s
app.references.tenant-service.read-timeout=3s

# RabbitMQ: consume business audit events; invalid messages go to the dead-letter queue.
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
