spring.application.name=notification-service

server.port=8099

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/yongdrel_notifications}
spring.datasource.username=${DB_USERNAME:yongdrel}
spring.datasource.password=${DB_PASSWORD}

# Flyway manages the database schema
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:yongdrel}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# RabbitMQ listener retry
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# JWT validation
spring.security.oauth2.resourceserver.jwt.public-key-location=file:${JWT_PUBLIC_KEY_PATH}
app.jwt.issuer=yongdrel-auth
app.jwt.audience=yongdrel-api

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# Development-only test endpoint
app.notifications.test-endpoint-enabled=${NOTIFICATION_TEST_ENDPOINT_ENABLED:false}

