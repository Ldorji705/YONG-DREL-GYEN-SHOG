spring.application.name=wallet-service
server.port=8097

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3307/yongdrel_wallets
spring.datasource.username=${DB_USERNAME:yongdrel}
spring.datasource.password=${DB_PASSWORD}

# Schema is created by Flyway migrations; Hibernate only checks it matches
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:yongdrel}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Actuator
management.endpoints.web.exposure.include=health,info

# JWT validation (same settings as the other services)
spring.security.oauth2.resourceserver.jwt.public-key-location=file:${JWT_PUBLIC_KEY_PATH}
app.jwt.issuer=yongdrel-auth
app.jwt.audience=yongdrel-api

# Wallet currency (one currency per platform)
app.wallet.currency=BTN

# Shared secret for internal callers of POST /api/wallets/credit (e.g. Refund, Prize Claim).
# Never commit the real value.
app.wallet.internal-api-key=${WALLET_INTERNAL_API_KEY:}

# Transaction Ledger (every wallet operation is recorded there)
app.ledger.base-url=${LEDGER_SERVICE_URL:http://localhost:8098}
app.ledger.internal-api-key=${LEDGER_INTERNAL_API_KEY:}

# Background job that re-sends operations the Ledger did not accept yet
app.wallet.ledger-sync.enabled=true
app.wallet.ledger-sync.delay-ms=30000
