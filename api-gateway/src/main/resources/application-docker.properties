spring.cloud.gateway.server.webflux.routes[5].uri=http://transaction-ledger-service:8098
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/ledger/me
spring.cloud.gateway.server.webflux.routes[5].predicates[1]=Method=GET

# Refund Service (SCRUM-254) - all endpoints need a user JWT
